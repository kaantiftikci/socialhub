<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mivelo reel</title>
<!--
  Mivelo tanıtım videosu (1080×1920, 30 fps). render.mjs bu sayfayı kare kare çizer:
  - Kompozisyon (arka plan, başlıklar, kart, imleç, tuşlar) tamamen window.render(t) ile zamanın fonksiyonu.
  - Kartın içindeki uygulama GERÇEK tek dosya demodur (/app/index.html, iframe): render.mjs sanal saati ilerletir ve
    render(t)'nin döndürdüğü eylemleri (tıklama, yazma, tuş) Playwright'ın gerçek fare/klavyesiyle uygular.
  - Yazı tipi: waitlist ile aynı yığın (-apple-system / SF Pro Display). SF Pro yoksa (Linux) Inter Display (opsz) kullanılır.
-->
<style>
@font-face { font-family: 'Mivelo Display'; font-style: normal; font-weight: 100 900; font-display: block; src: url(assets/fonts/inter-latin-opsz-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+2318,U+21E5,U+21B5,U+21E7,U+FEFF,U+FFFD; }
@font-face { font-family: 'Mivelo Display'; font-style: normal; font-weight: 100 900; font-display: block; src: url(assets/fonts/inter-latin-ext-opsz-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
:root {
  --bg: #FBFBFD; --ink: #16151B; --ink2: #44424D; --ink3: #6E6C78; --ink4: #A3A1AC; --line: #E6E5EC;
  --brand: #6C47FF; --brand-soft: #F0ECFF; --brand-soft2: #E2DAFF; --lime: #D4FF3F; --lime-ink: #1A2300;
  --display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Mivelo Display', sans-serif;
  --text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Mivelo Display', sans-serif;
}
html, body { margin: 0; width: 1080px; height: 1920px; overflow: clip; background: var(--bg); }
#stage { position: absolute; inset: 0; overflow: clip; font-family: var(--text); color: var(--ink); -webkit-font-smoothing: antialiased; font-optical-sizing: auto; }
#stage * { box-sizing: border-box; }
.a { position: absolute; left: 0; top: 0; pointer-events: none; }
/* arka plan: tek renk + yavaş kayan iki yumuşak ışık (marka morunun açığı ve çok hafif lime) */
.glow { position: absolute; border-radius: 50%; pointer-events: none; }
/* başlıklar */
.say { position: absolute; left: 0; width: 1080px; text-align: center; pointer-events: none; font-family: var(--display); }
.say .kick { font-size: 30px; font-weight: 600; color: var(--brand); letter-spacing: -0.01em; margin-bottom: 14px; }
.say .hl { font-weight: 700; letter-spacing: -0.035em; line-height: 1.04; color: var(--ink); }
.say .sub { font-family: var(--text); font-size: 34px; font-weight: 500; color: var(--ink3); margin-top: 22px; letter-spacing: -0.01em; }
.say .sub .it { transition: none; }
.say .w { display: inline-block; white-space: pre; }
.say em { font-style: normal; color: var(--brand); }
/* kart: bildirim hapı → logo → uygulama penceresi (tek nesne, biçim değiştirir) */
#vp { position: absolute; left: 0; top: 0; overflow: clip; pointer-events: auto; }
#vp .appbox { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
#vp iframe { border: 0; width: 1440px; height: 900px; display: block; background: #F7F6FA; }
#vp .glyph, #vp .pilltxt { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
#vp .pilltxt { font-family: var(--display); font-weight: 650; font-size: 38px; letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
#vp .pilltxt b { color: var(--brand); font-weight: 700; }
/* bildirimler */
.notif { width: 820px; padding: 26px 30px; border-radius: 34px; background: rgba(255,255,255,.94); border: 1px solid rgba(230,229,236,.9);
  box-shadow: 0 2px 4px rgba(20,18,40,.04), 0 24px 60px -18px rgba(40,30,110,.28); display: flex; gap: 24px; align-items: center; font-family: var(--text); }
.notif img { width: 84px; height: 84px; border-radius: 22px; flex: none; }
.notif .t { flex: 1; min-width: 0; }
.notif .top { display: flex; justify-content: space-between; font-size: 24px; color: var(--ink3); font-weight: 500; }
.notif .who { font-size: 31px; font-weight: 650; margin-top: 4px; letter-spacing: -0.01em; }
.notif .msg { font-size: 29px; color: var(--ink2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chipimg { width: 132px; height: 132px; border-radius: 34px; box-shadow: 0 16px 36px -14px rgba(40,30,110,.35); }
/* destek baloncukları (kartın altında) */
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 20px 30px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
  box-shadow: 0 1px 2px rgba(20,18,40,.05), 0 18px 40px -18px rgba(40,30,110,.3); font-size: 30px; font-weight: 600; color: var(--ink); white-space: nowrap; letter-spacing: -0.01em; }
.pill svg { color: var(--brand); }
.pill.lime { background: var(--lime); border-color: transparent; color: var(--lime-ink); }
.pill.lime svg { color: var(--lime-ink); }
.pill.ink { background: var(--ink); border-color: transparent; color: #fff; }
.pill.ink svg { color: var(--lime); }
/* tuş kapakları */
.key { min-width: 116px; height: 116px; padding: 0 28px; border-radius: 26px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center;
  font-family: var(--display); font-size: 52px; font-weight: 600; color: var(--ink); box-shadow: 0 7px 0 #E4E2EC, 0 18px 36px -14px rgba(40,30,110,.3); }
.key.on { background: var(--lime); border-color: #C4EE2C; color: var(--lime-ink); box-shadow: 0 2px 0 #B7DF22, 0 10px 24px -12px rgba(40,30,110,.3); }
.key small { font-size: 28px; font-weight: 600; }
.sc { width: 900px; padding: 34px 40px; border-radius: 40px; background: #fff; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(20,18,40,.05), 0 30px 70px -28px rgba(40,30,110,.35);
  display: grid; grid-template-columns: 1fr 1fr; gap: 22px 34px; font-size: 27px; color: var(--ink2); font-weight: 500; }
.sc div { display: flex; align-items: center; gap: 16px; white-space: nowrap; }
.sc kbd { font-family: var(--display); font-size: 25px; font-weight: 650; color: var(--ink); background: var(--brand-soft); border-radius: 12px; padding: 7px 13px; min-width: 52px; text-align: center; }
/* son kart */
.cta { padding: 34px 58px; border-radius: 999px; background: var(--brand); color: #fff; font-family: var(--display); font-size: 40px; font-weight: 650; letter-spacing: -0.015em; white-space: nowrap;
  box-shadow: 0 24px 50px -18px rgba(108,71,255,.65); display: flex; align-items: center; gap: 16px; }
.cta.done { background: var(--lime); color: var(--lime-ink); box-shadow: 0 24px 50px -18px rgba(150,190,20,.6); }
.url { font-family: var(--display); font-size: 52px; font-weight: 700; letter-spacing: -0.03em; }
.foot { font-size: 28px; color: var(--ink3); font-weight: 500; white-space: nowrap; }
/* üst köşe işaretleri */
.hud { font-size: 26px; font-weight: 600; color: var(--ink3); display: flex; align-items: center; gap: 12px; font-family: var(--display); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.hud b { color: var(--ink); font-size: 30px; letter-spacing: -0.02em; }
#cur { width: 46px; height: 46px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.28)); z-index: 40; }
#ring { width: 90px; height: 90px; border-radius: 50%; border: 5px solid var(--brand); z-index: 39; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const A = 'assets';
const DUR = 46;
const stage = document.getElementById('stage');

/* ───────── motor ───────── */
const ease = {
  lin: (x) => x,
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  o: (x) => 1 - Math.pow(1 - x, 3),
  i: (x) => x * x * x,
  ox: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  iox: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2),
  back: (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spring: (x) => (x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(10.5 * x)),
};
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const hooks = [];
const hook = (fn) => (hooks.push(fn), fn);
function el(html, cls = '', parent = stage) {
  const d = document.createElement('div');
  d.className = 'a ' + cls;
  d.innerHTML = html;
  parent.appendChild(d);
  return d;
}
/**
 * Anahtar kare izi: [[t, {özellik: değer}, kolaylık]]. Bir özellik tanımlandığı ilk kareden önce o ilk değeri, sonuncudan sonra
 * son değeri taşır; aradaki geçişte bir SONRAKİ karenin kolaylığı kullanılır. S (ölçek) logaritmik aralıkta.
 */
function track(keys) {
  const ks = keys.map(([t, p, e]) => ({ t, p, e: e || 'io' })).sort((a, b) => a.t - b.t);
  // {f: hedef} anahtarı fx/fy'yi tanımlar (değer geçişin başında DOM'dan çözülür)
  for (const k of ks) if (k.p.f) { if (!('fx' in k.p)) k.p.fx = undefined; if (!('fy' in k.p)) k.p.fy = undefined; }
  const val = (prop, t, def) => {
    let a = -1, b = -1;
    for (let i = 0; i < ks.length; i++) {
      if (!(prop in ks[i].p)) continue;
      if (ks[i].t <= t) a = i;
      else { b = i; break; }
    }
    if (a < 0 && b < 0) return def;
    if (a < 0) return resolve(ks[b], prop);
    if (b < 0) return resolve(ks[a], prop);
    const k0 = ks[a], k1 = ks[b];
    const v0 = resolve(k0, prop), v1 = resolve(k1, prop);
    const p = ease[k1.e](clamp((t - k0.t) / (k1.t - k0.t)));
    return prop === 'S' ? Math.exp(lerp(Math.log(v0), Math.log(v1), p)) : lerp(v0, v1, p);
  };
  return { ks, val };
}
/* Kamera odağı / imleç hedefi: {f: hedef} alanlı anahtar ilk gerektiğinde (geçişin başında) uygulamanın DOM'undan çözülür */
function resolve(k, prop) {
  if ((prop === 'fx' || prop === 'fy') && k.p.f && !k.done) {
    const r = rectOf(k.p.f);
    k.p.fx = r ? r.x + r.width * (k.p.f.ax ?? 0.5) + (k.p.f.dx ?? 0) : k.p.fx ?? 720;
    k.p.fy = r ? r.y + r.height * (k.p.f.ay ?? 0.5) + (k.p.f.dy ?? 0) : k.p.fy ?? 450;
    k.done = true;
  }
  return k.p[prop];
}

/* ───────── uygulama (gerçek demo, iframe) ───────── */
const doc = () => document.getElementById('app')?.contentDocument;
/** Hedef: {sel, text, pick: 'first'|'last'|n} → iframe içi dikdörtgen (uygulama koordinatı = 1440×900) */
function findEl(tg) {
  const d = doc();
  if (!d) return null;
  let list = [...d.querySelectorAll(tg.sel)];
  if (tg.text) list = list.filter((e) => e.textContent.replace(/\s+/g, ' ').includes(tg.text));
  if (tg.visible !== false) list = list.filter((e) => { const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
  if (!list.length) return null;
  return tg.pick === 'last' ? list[list.length - 1] : typeof tg.pick === 'number' ? list[Math.min(tg.pick, list.length - 1)] : list[0];
}
function rectOf(tg) {
  const e = findEl(tg);
  return e ? e.getBoundingClientRect() : null;
}

/* ───────── eylemler (render.mjs gerçek fare/klavye ile uygular) ───────── */
const ACTS = [];
const CUES = []; // ses efektleri: {t, k}
const cue = (t, k, v) => CUES.push({ t, k, v });
const click = (t, sfx) => (ACTS.push({ t, k: 'down', sfx }), ACTS.push({ t: t + 0.08, k: 'up' }), CLICKS.push(t));
const press = (t, key) => ACTS.push({ t, k: 'key', key });
const typeText = (t0, text, cps = 17) => ACTS.push({ t: t0, k: 'type', text, cps, done: 0 });
const inApp = (t, fn) => ACTS.push({ t, k: 'eval', fn });
const SCROLLS = [];
const scroll = (t0, t1, sel, to, e = 'io') => SCROLLS.push({ t0, t1, sel, to, e, from: null });
const CLICKS = [];

/* ───────── arka plan ───────── */
const glows = [
  el('', 'glow'), el('', 'glow'), el('', 'glow'),
];
glows[0].style.cssText += 'width:1500px;height:1500px;background:radial-gradient(circle, rgba(226,218,255,.95) 0%, rgba(226,218,255,0) 62%)';
glows[1].style.cssText += 'width:1300px;height:1300px;background:radial-gradient(circle, rgba(212,255,63,.22) 0%, rgba(212,255,63,0) 60%)';
glows[2].style.cssText += 'width:1200px;height:1200px;background:radial-gradient(circle, rgba(240,236,255,1) 0%, rgba(240,236,255,0) 60%)';
hook((t) => {
  const a = t * 0.11;
  glows[0].style.transform = `translate(${-420 + Math.sin(a) * 120}px, ${-260 + Math.cos(a * 0.8) * 140}px)`;
  glows[1].style.transform = `translate(${260 + Math.cos(a * 0.9) * 140}px, ${1080 + Math.sin(a * 1.1) * 160}px)`;
  glows[2].style.transform = `translate(${-300 + Math.sin(a * 0.7 + 2) * 100}px, ${1250 + Math.cos(a) * 120}px)`;
});

/* ───────── ikonlar ───────── */
const ICON = {
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  sparkle: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M12 8.5 13.3 11 16 12l-2.7 1-1.3 2.5-1.3-2.5L8 12l2.7-1z"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  send: '<path d="M4 12 20 4l-5 16-3.5-6.5z"/><path d="m11.5 13.5 3-3"/>',
  quote: '<path d="M7 7h4v4c0 3-1.5 5-4 6M14 7h4v4c0 3-1.5 5-4 6"/>',
  text: '<path d="M5 7h14M5 12h10M5 17h7"/>',
  hand: '<path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14c0 3.5-2.5 6-6 6-2.2 0-3.8-1-5-3l-2-3.5a1.5 1.5 0 0 1 2.6-1.5L8 13"/>',
  bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
  shield: '<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/>',
};
const ic = (n, s = 34) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const GLYPH = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 28 28"><path d="M8 8c4.5 0 6 3 6 6s1.5 6 6 6M8 20c4.5 0 6-3 6-6" stroke="#fff" stroke-width="2.3" fill="none" stroke-linecap="round"/><circle cx="20" cy="8" r="2.5" fill="#D4FF3F"/></svg>`;
const LOGO = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 28 28"><rect width="28" height="28" rx="9" fill="#6C47FF"/><path d="M8 8c4.5 0 6 3 6 6s1.5 6 6 6M8 20c4.5 0 6-3 6-6" stroke="#fff" stroke-width="2.3" fill="none" stroke-linecap="round"/><circle cx="20" cy="8" r="2.5" fill="#D4FF3F"/></svg>`;
const chipSrc = (k) => `${A}/chip-${k}.png`;

/* ───────── yardımcı: genel öğe izi (merkez koordinat) ───────── */
function place(node, keys) {
  const tr = track(keys);
  hook((t) => {
    const o = tr.val('o', t, 1);
    if (o <= 0.001) { node.style.visibility = 'hidden'; return; }
    node.style.visibility = 'visible';
    node.style.opacity = o;
    const b = tr.val('b', t, 0);
    node.style.filter = b > 0.05 ? `blur(${b}px)` : 'none';
    node.style.transform = `translate(${tr.val('x', t, 540)}px, ${tr.val('y', t, 960)}px) translate(-50%, -50%) scale(${tr.val('s', t, 1)}) rotate(${tr.val('r', t, 0)}deg)`;
  });
  return node;
}

/* ───────── başlıklar: kelime kelime bulanıklıktan netleşme ───────── */
/**
 * say(t0, t1, {k: üst etiket, l: ['satır', '[vurgulu] kelimeler'], sub, y, size})
 * Her kelime 55 ms arayla aşağıdan, 14 px bulanıktan netleşerek girer; t1'de yukarı doğru bulanıklaşarak çıkar.
 */
function say(t0, t1, o) {
  const box = el('', 'say');
  box.style.top = (o.y ?? 280) + 'px';
  box.style.left = '0';
  box.classList.remove('a');
  const parts = [];
  let i = 0;
  const words = (s, parent, cls) => {
    const line = document.createElement('div');
    line.className = cls;
    parent.appendChild(line);
    let hl = false;
    const tokens = s.split(/(\s+)/);
    for (const tok of tokens) {
      if (!tok) continue;
      if (/^\s+$/.test(tok)) { line.appendChild(document.createTextNode(' ')); continue; }
      let w = tok;
      const open = w.startsWith('[');
      if (open) (hl = true), (w = w.slice(1));
      const close = w.endsWith(']');
      if (close) w = w.slice(0, -1);
      const sp = document.createElement('span');
      sp.className = 'w';
      sp.innerHTML = hl ? `<em>${w}</em>` : w;
      line.appendChild(sp);
      parts.push({ sp, d: i++ * 0.055 });
      if (close) hl = false;
    }
    return line;
  };
  if (o.k) words(o.k, box, 'kick');
  for (const l of o.l) { const d = words(l, box, 'hl'); d.style.fontSize = (o.size ?? 82) + 'px'; }
  let subLine = null;
  if (o.sub) { i += 2; subLine = words(o.sub, box, 'sub'); }
  hook((t) => {
    for (const { sp, d } of parts) {
      const p = clamp((t - t0 - d) / 0.62);
      const q = clamp((t - t1 - d * 0.35) / 0.38);
      if (p <= 0 || q >= 1) { sp.style.visibility = 'hidden'; continue; }
      const e = ease.ox(p), x = ease.i(q);
      sp.style.visibility = 'visible';
      sp.style.opacity = Math.min(1, e * 1.15) * (1 - x);
      sp.style.transform = `translateY(${(1 - e) * 44 - x * 34}px)`;
      const b = (1 - e) * 16 + x * 14;
      sp.style.filter = b > 0.1 ? `blur(${b}px)` : 'none';
    }
  });
  return { box, subLine, parts };
}

/* ───────── kart (#vp) ───────── */
const vp = el('<div class="appbox"><iframe id="app" src="/app/index.html" tabindex="-1"></iframe></div><div class="glyph"></div><div class="pilltxt"></div>');
vp.id = 'vp';
vp.classList.remove('a');
const appbox = vp.querySelector('.appbox');
const glyph = vp.querySelector('.glyph');
const pilltxt = vp.querySelector('.pilltxt');
glyph.innerHTML = GLYPH(200);
pilltxt.innerHTML = '<span><b>213</b> yeni mesaj · 12 uygulama</span>';
const FULL = 1000 / 1440; // pencerenin tamamı 1000 px genişlikte
const CARD = [];
const cam = (t, p, e) => CARD.push([t, p, e]);
let camTrack = null;
let camNow = null; // bu karedeki kart geometrisi (imleç eşlemesi için)
function camHook(t) {
  const v = (k, d) => camTrack.val(k, t, d);
  const W = v('W', 1000), H = v('H', 625), cx = v('cx', 540), cy = v('cy', 1040), R = v('R', 28), bg = v('bg', 0), s = v('s', 1);
  const S = v('S', FULL), fx = v('fx', 720), fy = v('fy', 450);
  const vis = v('o', 1);
  vp.style.visibility = vis <= 0.001 ? 'hidden' : 'visible';
  vp.style.opacity = vis;
  vp.style.width = W + 'px';
  vp.style.height = H + 'px';
  vp.style.borderRadius = R + 'px';
  const col = (a, b) => Math.round(lerp(a, b, bg));
  vp.style.background = `rgb(${col(255, 108)},${col(255, 71)},${col(255, 255)})`;
  const sh = v('sh', 1);
  vp.style.boxShadow = `0 2px 6px rgba(20,18,40,${0.05 * sh}), 0 50px 110px -30px rgba(40,30,110,${0.42 * sh}), 0 0 0 1px rgba(230,229,236,${0.9 * sh * (1 - bg)})`;
  const rx = v('rx', 0), ry = v('ry', 0);
  vp.style.transform = `translate(${cx - W / 2}px, ${cy - H / 2}px) perspective(2200px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s})`;
  // uygulama: odak noktası kartın ortasına; kenarlar uygulamanın dışına taşmasın
  const aw = 1440 * S, ah = 900 * S;
  let left = W / 2 - fx * S, top = H / 2 - fy * S;
  left = aw >= W ? clamp(left, W - aw, 0) : (W - aw) / 2;
  top = ah >= H ? clamp(top, H - ah, 0) : (H - ah) / 2;
  appbox.style.transform = `translate(${left}px, ${top}px) scale(${S})`;
  const ao = v('ao', 1), ab = v('ab', 0);
  appbox.style.opacity = ao;
  appbox.style.filter = ab > 0.1 ? `blur(${ab}px)` : 'none';
  appbox.style.visibility = ao <= 0.001 ? 'hidden' : 'visible';
  const lg = v('lg', 0);
  glyph.style.opacity = lg;
  glyph.style.transform = `scale(${lerp(0.6, 1, lg) * Math.min(W, H) / 280})`;
  glyph.style.filter = lg < 0.99 ? `blur(${(1 - lg) * 12}px)` : 'none';
  const pl = v('pl', 0);
  pilltxt.style.opacity = pl;
  pilltxt.style.filter = pl < 0.99 ? `blur(${(1 - pl) * 10}px)` : 'none';
  camNow = { left: cx - W / 2 + left, top: cy - H / 2 + top, S, W, H, cx, cy, flat: Math.abs(rx) + Math.abs(ry) < 0.01 && Math.abs(s - 1) < 0.001 };
}

/** İmleç anahtarı: at = uygulama hedefi {sel,text,…} ya da {x,y} (uygulama koord.) ya da {sx,sy} (sahne koord.) */
const mv = (t, at, e = 'io') => CUR.push({ t, at, e });
const hideCur = (t) => CUR.push({ t, hide: true });
let lastPos = { x: 720, y: 450, stage: false };
function curPos(k) {
  if (k.at.sx != null) return { x: k.at.sx, y: k.at.sy, stage: true };
  if (k.at.sel) {
    const r = rectOf(k.at);
    if (r) k.last = { x: r.x + r.width * (k.at.ax ?? 0.5) + (k.at.dx ?? 0), y: r.y + r.height * (k.at.ay ?? 0.5) + (k.at.dy ?? 0) };
    return { ...(k.last ?? { x: 720, y: 450 }), stage: false };
  }
  return { x: k.at.x, y: k.at.y, stage: false };
}
const toStage = (pp) => (pp.stage ? pp : { x: camNow.left + pp.x * camNow.S, y: camNow.top + pp.y * camNow.S, stage: true });
function curHook(t) {
  let a = -1;
  for (let i = 0; i < CUR.length; i++) if (CUR[i].t <= t) a = i;
  const k0 = CUR[a];
  if (!k0 || k0.hide) { cur.style.visibility = 'hidden'; ring.style.visibility = 'hidden'; return null; }
  // geçiş k0.t'de, imlecin o anki konumundan başlar; hedef canlı izlenir (liste kayarsa imleç de kayar)
  if (!k0.from) k0.from = { ...lastPos };
  const dest = curPos(k0);
  const p = ease[k0.e](clamp((t - k0.t) / (k0.dur ?? 0.55)));
  let f = k0.from, d = dest;
  if (f.stage !== d.stage) (f = toStage(f)), (d = toStage(d));
  // hafif kavis: düz çizgi yerine el hareketi gibi
  const arc = Math.sin(p * Math.PI) * 0.08;
  const pos = { x: lerp(f.x, d.x, p) + (d.y - f.y) * arc, y: lerp(f.y, d.y, p) - (d.x - f.x) * arc, stage: d.stage };
  lastPos = pos;
  const sp = toStage(pos);
  // basış: tıklamada kısa küçülme + genişleyen halka
  let sc = 1, ro = 0, rs = 0.4;
  for (const c of CLICKS) {
    const dt = t - c;
    if (dt >= -0.02 && dt < 0.16) sc = Math.min(sc, 0.8 + (0.2 * Math.abs(dt - 0.06)) / 0.1);
    if (dt >= 0 && dt < 0.45) (ro = 0.55 * (1 - dt / 0.45)), (rs = 0.35 + (dt / 0.45) * 0.9);
  }
  cur.style.visibility = 'visible';
  cur.style.transformOrigin = '11px 6px';
  cur.style.transform = `translate(${sp.x - 11}px, ${sp.y - 6}px) scale(${sc})`;
  ring.style.visibility = ro > 0 ? 'visible' : 'hidden';
  ring.style.opacity = ro;
  ring.style.transform = `translate(${sp.x - 45}px, ${sp.y - 45}px) scale(${rs})`;
  return { x: sp.x, y: sp.y };
}

function keycaps(t0, t1, labels, presses = [], y = 1610) {
  const row = el(labels.map((l) => `<div class="key">${l}</div>`).join(''));
  row.style.display = 'flex';

  const keysEl = [...row.children];

  hook((t) => {
    const on = presses.some((p) => t >= p && t < p + 0.22);
    for (const k of keysEl) {
      k.classList.toggle('on', on);
      k.style.transform = on ? 'translateY(5px)' : 'none';
    }
  });
  return row;
}
/** Kartın altındaki destek baloncuğu */

}

/* ───────── kurulum ───────── */
camTrack = track(CARD);
CUR.sort((a, b) => a.t - b.t);
ACTS.sort((a, b) => a.t - b.t);
// uygulamaya gitmeyen tıklamalar: sahne koordinatındaki imleç (CTA) için fare olayı gönderme
for (const a of ACTS) if (a.k === 'down' || a.k === 'up') { const k = [...CUR].reverse().find((c) => c.t <= a.t); a.stage = !!(k && k.at && k.at.sx != null); }
window.DUR = DUR;
window.CUES_STATIC = CUES;

let actIdx = 0;
/**
 * Bir kareyi çiz. Dönen: imleç konumu (sahne px, gizliyse null) + bu karede uygulanacak gerçek girişler
 * (fare bas/bırak, tuş, yazılacak karakterler). render.mjs bunları Playwright ile uygular.
 */
window.render = (t) => {
  const out = [];
  // uygulama içi eylemler ve kaydırmalar (sıralı çizimde bir kez)
  while (actIdx < ACTS.length && ACTS[actIdx].t <= t) {
    const a = ACTS[actIdx++];
    if (a.k === 'eval') { try { a.fn(); } catch (e) { console.error('eval', e); } }
    else if (a.k === 'type') TYPING.push(a);
    else if (a.k === 'down') out.push(guardClick(a, t));
    else out.push(a);
  }
  for (const a of TYPING) {
    const chars = [...a.text];
    const n = Math.min(chars.length, Math.floor((t - a.t) * a.cps) + 1);
    if (n > a.done) { out.push({ k: 'text', text: chars.slice(a.done, n).join('') }); a.done = n; }
  }
  const d = doc();
  for (const s of SCROLLS) {
    if (t < s.t0 || !d) continue;
    const e = d.querySelector(s.sel);
    if (!e) continue;
    if (s.from == null) { s.from = e.scrollTop; s.target = s.to === 'max' ? e.scrollHeight - e.clientHeight : s.to; }
    if (t <= s.t1 + 0.05) e.scrollTop = lerp(s.from, s.target, ease[s.e](clamp((t - s.t0) / (s.t1 - s.t0))));
  }
  camHook(t);
  for (const h of hooks) h(t);
  const c = curHook(t);
  return { cursor: c, acts: out };
};
const TYPING = [];
/**
 * Tıklama güvencesi: imlecin altındaki öğe hedef değilse (kamera kayarken ıskalama) hedef DOM üzerinden tıklanır/odaklanır
 * ve gerçek fare basışı atlanır. Böylece akış her çizimde aynı ilerler.
 */
function guardClick(a, t) {
  if (a.stage) return a;
  const k = [...CUR].reverse().find((c) => c.t <= t && c.at);
  if (!k || !k.at.sel) return a;
  const d = doc();
  const target = findEl(k.at);
  if (!d || !target) return a;
  const hit = lastPos.stage ? null : d.elementFromPoint(lastPos.x, lastPos.y);
  if (hit && (hit === target || target.contains(hit) || hit.contains(target))) return a;
  console.warn('tıklama güvencesi', t.toFixed(2), k.at.sel, k.at.text || '');
  if (/^(TEXTAREA|INPUT)$/.test(target.tagName)) target.focus();
  else target.click();
  return { ...a, skip: true };
}

/* iframe'deki CSS geçiş/animasyonlarını sanal zamana bağla (gerçek saat değil, video zamanı) */
const seen = new WeakMap();
window.syncAnims = (t) => {
  // odaklanan öğeyi göstermek için tarayıcının kaydırdığı kapları geri al (kamera yalnız bizim dönüşümümüz)
  for (const e of [document.scrollingElement, stage, vp]) if (e) (e.scrollTop = 0), (e.scrollLeft = 0);
  const d = doc();
  if (!d) return;
  if (d.scrollingElement) (d.scrollingElement.scrollTop = 0), (d.scrollingElement.scrollLeft = 0);
  for (const a of d.getAnimations()) {
    if (!seen.has(a)) { seen.set(a, t); try { a.pause(); } catch {} }
    try { a.currentTime = (t - seen.get(a)) * 1000; } catch {}
  }
};
window.appReady = () => { const d = doc(); return !!(d && d.querySelector('.row') && d.fonts && d.fonts.status === 'loaded'); };
window.ready = (async () => {
  await document.fonts.load('700 80px "Mivelo Display"');
  await document.fonts.load('500 30px "Mivelo Display"');
  await Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))));
  return document.fonts.check('700 80px "Mivelo Display"');
})();
