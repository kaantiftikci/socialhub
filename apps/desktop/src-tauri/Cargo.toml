[package]
name = "kavsak-desktop"
version = "0.1.0"
description = "Kavşak — tüm mesajlaşma kanalların için tek gelen kutusu"
authors = ["Kaan"]
edition = "2021"

[lib]
name = "kavsak_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
