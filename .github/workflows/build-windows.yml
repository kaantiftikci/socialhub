# Windows masaüstü paketi (Tauri 2 + NSIS kurulumu). Elle (Actions → build-windows → Run workflow) ya da v* etiketiyle çalışır.
# Çıktı: Mivelo_<sürüm>_x64-setup.exe (yapıt olarak indirilir). İmzasız: ilk açılışta SmartScreen uyarısı çıkar.
# Yerel modüller (better-sqlite3, better-sqlite3-multiple-ciphers) npm ci/bundle-core sırasında win32-x64 için hazır ikili indirir
# (yoksa runner'daki VS Build Tools ile derlenir). Node çalışma zamanı pakete gömülür (KAVSAK_BUNDLE_NODE=1).
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    env:
      # çekirdekte Playwright tarayıcısı paketlenmez; kullanıcı ilk tarayıcı kanalında indirir
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - name: Simgeler (icon.ico yoksa icon.png'den üret)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          if (-not (Test-Path src-tauri/icons/icon.ico)) { npx tauri icon src-tauri/icons/icon.png }
      - run: npm run build -w packages/core
      - run: npm run build -w apps/web
      - name: Çekirdek birim testleri (Windows)
        run: npm test -w packages/core
        continue-on-error: true
      - name: Çekirdeği paketle (bundle-core + gömülü node.exe)
        run: node scripts/bundle-core.mjs
        env:
          KAVSAK_BUNDLE_NODE: '1'
      - name: Tauri build (NSIS)
        shell: bash
        working-directory: apps/desktop
        # beforeBuildCommand yukarıdaki adımları tekrarlamasın (null = yapılandırmadan kaldır)
        run: npx tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":null}}'
      - uses: actions/upload-artifact@v4
        with:
          name: mivelo-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
