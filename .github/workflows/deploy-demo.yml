# cPanel FTP'sine (TLS) yükler — aynı hesap (sunucu kaantiftikci.com), alan adı klasörleri ana dizinde:
#   apps/landing  → ~/mivelo.app/       (bekleme listesi sayfası; kayıtlar api/waitlist.php → ~/mivelo-data/waitlist.json)
#   apps/web demo → ~/demo.mivelo.app/  (VITE_STATIC_DEMO=1; demo hesapları ~/mivelo-data/users.json)
# Gizli: FTP_PASSWORD (GitHub → Settings → Secrets and variables → Actions). Sunucuda SSH/SFTP kapalı, FTP+TLS açık.
# Eşitleme durum dosyası (yayımlanan her dosyanın listesi) web kökünde herkese açık kalıyordu: api/ altına alındı ve
# oradaki .htaccess ile erişime kapatıldı. Kökteki eski .ftp-deploy-sync-state.json dosyaları sunucudan elle silinmeli.
name: deploy-demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/web/**', 'apps/landing/**', '.github/workflows/deploy-demo.yml']
concurrency: deploy-demo
jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FTP (TLS) ile yükle — mivelo.app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: kaantiftikci.com
          username: kaa300ftikcicom
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: apps/landing/
          server-dir: mivelo.app/
          state-name: api/.ftp-deploy-sync-state.json
          exclude: '**/.git*'
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: VITE_STATIC_DEMO=1 npm run build -w apps/web
        env:
          # Sentry yalnızca demoda (secret yoksa SDK hiç başlamaz); release = commit
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_COMMIT: ${{ github.sha }}
      # demo API'si geri bildirimi ve e-postayı mivelo.app ile ortak PHP kütüphaneleriyle işler
      - run: cp apps/landing/api/lib-smtp.php apps/landing/api/lib-feedback.php apps/web/dist/api/
      - name: FTP (TLS) ile yükle — demo.mivelo.app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: kaantiftikci.com
          username: kaa300ftikcicom
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: apps/web/dist/
          server-dir: demo.mivelo.app/
          state-name: api/.ftp-deploy-sync-state.json
          exclude: '**/.git*'
