# Masaüstü paketleri: macOS DMG (Apple Silicon + Intel) ve Windows kurulum dosyası (NSIS .exe), sonra mivelo.app/indir/files/'a yüklenir.
# Tetik YALNIZ elle (Actions → build-desktop → Run workflow) ya da v* etiketi: main'e her itme yeni sürüm YAYINLAMAZ (Kaan'ın kararı;
# küçük değişiklikler birikir, sürüm istenince çıkar — kullanıcılar her buton kaymasında "yeni sürüm" kartı görmesin).
# Sürüm: tauri.conf.json'daki ana sürüm + çalıştırma numarası (0.1.<n>); etiketle çalışınca etiketin sürümü (v0.2.0 → 0.2.0).
# Node çalışma zamanı pakete gömülür (KAVSAK_BUNDLE_NODE=1): kullanıcının Node kurmasına gerek yok. Chromium pakete KONMAZ,
# tarayıcıyla bağlanan ilk kanalda uygulama kendisi indirir (packages/core/src/browser-install.ts).
# Beeper (mautrix) köprüsü (apps/bridge, Go + CGO) her hedef için derlenip core/bin'e gömülür; ayrıca files/'a
# mivelo-bridge-<os>-<arch> olarak konur (geliştirme kurulumları ikiliyi buradan indirir, latest.json "bridge").
# İmza: macOS ad-hoc ("-"; Apple Developer hesabı yok → ilk açılışta "Yine de aç"), Windows imzasız (SmartScreen "Yine de çalıştır").
name: build-desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: build-desktop-${{ github.ref }}
  # süren derleme iptal edilmez (yarım kalan paket yüklenmez); yeni itme sıraya girer
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else
            base=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
            v="$base.$GITHUB_RUN_NUMBER"; fi
          echo "v=$v" >>"$GITHUB_OUTPUT"; echo "sürüm: $v"

  # Birim testleri YALNIZ burada, bir kez ve Linux'ta: özel depoda macOS dakikası kotadan 10 kat, Windows 2 kat düşüyor
  # (0.1.7'de testler üç makinede 15+ dk takılıp aylık 2.000 dakikanın %90'ını bitirdi). Sonuç paketlemeyi durdurmaz.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/bridge/go.sum
      - run: npm ci
      - name: Köprü testleri (Go)
        working-directory: apps/bridge
        run: go test ./...
      - name: Köprü ikilisi (çekirdeğin uçtan uca testi için)
        run: node scripts/build-bridge.mjs "$RUNNER_TEMP/mivelo-bridge"
      - name: Çekirdek birim testleri
        run: npm test -w packages/core
        env:
          MIVELO_TEST_BRIDGE_BIN: ${{ runner.temp }}/mivelo-bridge

  build:
    needs: version
    # takılan bir adım pahalı Mac dakikalarını yakmasın (normal derleme ≈10-12 dk)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-14, arch: arm64, target: aarch64-apple-darwin, bundle: dmg, goos: darwin, goarch: arm64 }
          # Intel: Apple Silicon makinesinde x64 Node (Rosetta) + x86_64 Rust hedefi → yerel modüller x64 kurulur
          - { name: mac-intel, os: macos-14, arch: x64, target: x86_64-apple-darwin, bundle: dmg, goos: darwin, goarch: amd64 }
          # windows-latest (VS 2026) npm'in node-gyp'inde tanınmıyor → yerel modül derlenemiyor; VS 2022'li imaj
          - { name: windows-x64, os: windows-2022, arch: x64, target: x86_64-pc-windows-msvc, bundle: nsis, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VITE_APP_VERSION: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - name: Rosetta (Intel paketi için x64 Node)
        if: matrix.name == 'mac-intel'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/bridge/go.sum
      - name: C derleyicisi (köprü CGO)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then gcc --version | head -1; else cc --version | head -1; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - run: node -p "process.version + ' ' + process.arch"
      - run: npm ci
      - run: npm run build -w packages/core
      - run: npm run build -w apps/web
      - name: Çekirdeği paketle (bundle-core + gömülü node + köprü)
        run: node scripts/bundle-core.mjs
        env:
          KAVSAK_BUNDLE_NODE: '1'
          MIVELO_BUNDLE_BRIDGE: '1'
          MIVELO_BRIDGE_VERSION: ${{ needs.version.outputs.v }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Intel paketi Apple Silicon makinesinde çapraz derlenir
          CC: ${{ matrix.name == 'mac-intel' && 'clang -arch x86_64' || '' }}
          CGO_CFLAGS: ${{ matrix.goos == 'darwin' && '-mmacosx-version-min=11.0' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'darwin' && '-mmacosx-version-min=11.0' || '' }}
      - name: Köprü ikilisi mimarisi
        shell: bash
        run: |
          b=apps/desktop/src-tauri/core-bundle/bin/mivelo-bridge; [ -f "$b" ] || b="$b.exe"
          ls -la "$b"; file "$b" || true
      - name: Gömülü node ve yerel modül mimarisi
        if: runner.os == 'macOS'
        run: |
          file apps/desktop/src-tauri/core-bundle/bin/node
          find apps/desktop/src-tauri/core-bundle/node_modules -name '*.node' -exec file {} \; | head
      - name: Tauri build
        shell: bash
        working-directory: apps/desktop
        run: |
          cfg='{"version":"${{ needs.version.outputs.v }}","build":{"beforeBuildCommand":null}}'
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config "$cfg"
      # Tauri DMG'ye birim simgesi olarak gizli .VolumeIcon.icns koyuyor; Finder'da gizli dosyalar açıkken pencerede Mivelo'nun
      # yanında ikinci bir "amblem" gibi görünüyordu. Görüntü yazılabilir açılıp bu dosya (ve .fseventsd) silinir, yeniden sıkıştırılır.
      - name: DMG — gizli birim simgesini kaldır
        if: matrix.bundle == 'dmg'
        shell: bash
        run: |
          set -euo pipefail
          d=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          dmg=$(ls "$d"/*.dmg | head -1)
          rw="$RUNNER_TEMP/rw.dmg"; mp="$RUNNER_TEMP/dmg-mnt"
          hdiutil convert "$dmg" -format UDRW -o "$rw"
          mkdir -p "$mp"
          hdiutil attach "$rw" -readwrite -nobrowse -noverify -noautoopen -mountpoint "$mp"
          echo "önce:"; ls -la "$mp"
          rm -f "$mp/.VolumeIcon.icns"; rm -rf "$mp/.fseventsd"
          SetFile -a c "$mp" 2>/dev/null || true
          echo "sonra:"; ls -la "$mp"
          sync
          for i in 1 2 3 4 5; do hdiutil detach "$mp" && break || { sleep 3; [ $i = 5 ] && hdiutil detach -force "$mp"; }; done
          rm -f "$dmg"
          hdiutil convert "$rw" -format UDZO -imagekey zlib-level=9 -o "$dmg"
          rm -f "$rw"
          ls -la "$d"
      - name: Çıktıyı adlandır
        shell: bash
        run: |
          mkdir -p out
          b=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          if [ "${{ matrix.bundle }}" = dmg ]; then cp "$b"/dmg/*.dmg "out/Mivelo-${{ matrix.name }}.dmg"; else cp "$b"/nsis/*.exe "out/Mivelo-${{ matrix.name }}-setup.exe"; fi
          # geliştirme kurulumları (npm run dev) köprüyü buradan indirir
          ext=""; [ "${{ matrix.goos }}" = windows ] && ext=".exe"
          cp "apps/desktop/src-tauri/core-bundle/bin/mivelo-bridge$ext" "out/mivelo-bridge-${{ matrix.goos }}-${{ matrix.goarch }}$ext"
          ls -la out
      # GitHub çıktı deposu (upload-artifact) KULLANILMAZ: depo özelken kotası doluyor ("Artifact storage quota has been hit", 09.10;
      # 6-12 sa'de bir yeniden hesaplanıyor). Her iş paketini sunucuda web kökü dışındaki geçici klasöre yükler; publish yalnız üç iş
      # de başarılıysa dosyaları yerine taşır ve latest.json'u yazar (yarım sürüm yayınlanmaz).
      - name: Sunucuya yükle (geçici klasör)
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          node -e '
            const fs=require("fs"); const crypto=require("crypto"); const out={};
            // sha256: uygulama içi güncelleme (updater.ts) ve köprü indirmesi (sidecar.ts) indirdiği dosyayı bununla doğrular
            for (const f of fs.readdirSync("out")) { const b=fs.readFileSync("out/"+f); out[f]={size:b.length, sha256:crypto.createHash("sha256").update(b).digest("hex")}; }
            fs.writeFileSync(process.argv[1], JSON.stringify(out));
          ' "meta-${{ matrix.name }}.json"
          cat "meta-${{ matrix.name }}.json"
          up() { curl -sS --ssl-reqd --ftp-create-dirs --retry 4 --retry-delay 10 --retry-all-errors -u "kaa300ftikcicom:$FTP_PASSWORD" -T "$1" "ftp://kaantiftikci.com/mivelo-staging/$GITHUB_RUN_ID/"; }
          for f in out/*; do up "$f"; echo "yüklendi: $f"; done
          # bilgi dosyası EN SON: publish onu bulabiliyorsa paketler eksiksiz yüklenmiştir
          up "meta-${{ matrix.name }}.json"

  publish:
    needs: [version, build]
    # yalnız üç paket de başarılıysa: yarım sürüm (bir platform yeni, latest.json eski) yayınlanmaz
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP: ftp://kaantiftikci.com
      STAGE: mivelo-staging/${{ github.run_id }}
      DEST: mivelo.app/indir/files
    steps:
      - uses: actions/checkout@v4
      - name: Paket bilgileri + latest.json
        run: |
          set -e
          mkdir -p files meta
          for n in mac-arm64 mac-intel windows-x64; do
            curl -sS --ssl-reqd --retry 4 --retry-all-errors -u "kaa300ftikcicom:$FTP_PASSWORD" -o "meta/$n.json" "$FTP/$STAGE/meta-$n.json"
          done
          node -e '
            const fs=require("fs"); const v=process.argv[1]; const files={};
            for (const f of fs.readdirSync("meta")) Object.assign(files, JSON.parse(fs.readFileSync("meta/"+f, "utf8")));
            if (!Object.keys(files).length) { console.error("yüklenecek paket yok"); process.exit(1); }
            // köprü ikilileri: "darwin-arm64" → {file, size, sha256} (sidecar.ts indirirken doğrular)
            const bridge={}; for (const [f,x] of Object.entries(files)) { const m=/^mivelo-bridge-(\w+-\w+?)(?:\.exe)?$/.exec(f); if (m) bridge[m[1]]={file:f, ...x}; }
            fs.writeFileSync("files/latest.json", JSON.stringify({version:v, date:new Date().toISOString(), files, bridge}, null, 2));
            fs.writeFileSync("names.txt", Object.keys(files).join("\n") + "\n");
          ' "${{ needs.version.outputs.v }}"
          cp deploy/indir/.htaccess files/.htaccess
          cat files/latest.json
      - name: Yayınla — mivelo.app/indir/files (FTP + TLS)
        run: |
          set -e
          C=(curl -sS --ssl-reqd --retry 4 --retry-all-errors -u "kaa300ftikcicom:$FTP_PASSWORD")
          # paketler aynı sunucuda yer değiştirir (yeniden yükleme yok); latest.json EN SON → güncelleme yeni dosyaları ancak hazırken görür
          q=()
          while read -r f; do [ -n "$f" ] || continue; q+=(-Q "*DELE $DEST/$f" -Q "RNFR $STAGE/$f" -Q "RNTO $DEST/$f"); done < names.txt
          "${C[@]}" -l -o /dev/null "${q[@]}" "$FTP/"
          "${C[@]}" -T files/.htaccess "$FTP/$DEST/"
          "${C[@]}" -T files/latest.json "$FTP/$DEST/"
          curl -sS "https://mivelo.app/indir/files/latest.json?t=$GITHUB_RUN_ID" | head -c 200; echo
      - name: Geçici klasörleri temizle
        if: always()
        run: |
          C=(curl -sS --ssl-reqd -u "kaa300ftikcicom:$FTP_PASSWORD")
          # bu çalıştırmanın ve eski (başarısız) çalıştırmaların artıkları
          for d in $("${C[@]}" -l "$FTP/mivelo-staging/" 2>/dev/null | tr -d '\r' | sed 's#.*/##' | grep -E '^[0-9]+$'); do
            q=(); for f in $("${C[@]}" -l "$FTP/mivelo-staging/$d/" 2>/dev/null | tr -d '\r' | sed 's#.*/##' | grep -v '^\.*$'); do q+=(-Q "*DELE mivelo-staging/$d/$f"); done
            "${C[@]}" -l -o /dev/null "${q[@]}" -Q "*RMD mivelo-staging/$d" "$FTP/" && echo "silindi: $d" || true
          done
