<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mivelo — App Store ekranları</title>
<style>
/* App Store ekran görüntüleri (iPhone 6,9" / 6,7": 1290×2796). Her .shot 430×932 CSS pikseli, render.mjs 3× ölçekle çeker.
   Arayüz Mivelo masaüstü/web tasarım dilinin iOS uyarlaması: Inter, mor #6C47FF, lime #D4FF3F, açık zemin. */
@font-face{font-family:Inter;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;src:url(fonts/inter-latin-ext-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--ink:#16151B;--ink-2:#44424D;--ink-3:#6E6C78;--ink-4:#A3A1AC;--line:#ECEAF1;--bg:#F7F6FA;--brand:#6C47FF;--brand-ink:#4526C9;--brand-soft:#F0ECFF;--lime:#D4FF3F;--green:#1FA971}
*{box-sizing:border-box}
body{margin:0;background:#ddd;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
.shot{position:relative;width:430px;height:932px;overflow:hidden;margin:0 0 20px}
svg{flex-shrink:0}

/* ---------- zemin + başlık ---------- */
.bg{position:absolute;inset:0;background:
  radial-gradient(60% 40% at 15% 18%,rgba(196,206,255,.95),transparent 70%),
  radial-gradient(55% 45% at 90% 10%,rgba(226,214,255,.95),transparent 70%),
  radial-gradient(70% 50% at 75% 80%,rgba(206,232,255,.9),transparent 70%),
  radial-gradient(60% 50% at 10% 90%,rgba(245,222,255,.85),transparent 70%),
  linear-gradient(180deg,#EEF0FF,#F4EFFF)}
.shot.dark .bg{background:
  radial-gradient(60% 40% at 20% 12%,rgba(108,71,255,.55),transparent 70%),
  radial-gradient(50% 40% at 95% 30%,rgba(226,107,184,.35),transparent 70%),
  radial-gradient(60% 50% at 70% 95%,rgba(212,255,63,.16),transparent 70%),
  linear-gradient(180deg,#17132B,#231A47)}
.head{position:absolute;left:0;right:0;top:62px;text-align:center;padding:0 30px;z-index:2}
.kick{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--brand-ink);font-size:12px;font-weight:600;letter-spacing:.2px;box-shadow:0 0 0 1px rgba(108,71,255,.15)}
.kick svg{width:13px;height:13px}
.shot.dark .kick{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.h{margin:14px 0 0;font-size:33px;line-height:1.08;letter-spacing:-1.1px;font-weight:700;color:var(--ink)}
.h em{font-style:normal;background:linear-gradient(92deg,#6C47FF,#A06BFF 50%,#E26BB8);-webkit-background-clip:text;background-clip:text;color:transparent}
.shot.dark .h{color:#fff}
.shot.dark .h em{background:linear-gradient(92deg,#D4FF3F,#9DF5C8);-webkit-background-clip:text;background-clip:text}
.sub{margin:10px auto 0;max-width:330px;font-size:14.5px;line-height:1.45;color:var(--ink-3)}
.shot.dark .sub{color:rgba(255,255,255,.7)}

/* ---------- iPhone çerçevesi ---------- */
.phone{position:absolute;left:50%;top:246px;width:417px;height:876px;margin-left:-208.5px;transform:scale(.8);transform-origin:50% 0;z-index:1;
  border-radius:66px;background:#0E0E12;padding:12px;box-shadow:0 0 0 2px #2A2A31,0 0 0 3.5px #0B0B0E,0 60px 110px -40px rgba(40,24,120,.55),0 30px 60px -30px rgba(0,0,0,.35)}
.shot.dark .phone{box-shadow:0 0 0 2px #3A3A44,0 0 0 3.5px #0B0B0E,0 60px 120px -30px rgba(0,0,0,.8),0 0 80px -10px rgba(108,71,255,.45)}
.scr{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:var(--bg);color:var(--ink)}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:30}
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0 50px;font-size:16.5px;font-weight:600;z-index:25}
.sb .r{display:flex;gap:6px;align-items:center}
.homeind{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#111;z-index:30}

/* ---------- uygulama ortak ---------- */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.body{position:absolute;left:0;right:0;top:54px;bottom:0;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 0}
.round{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.round.brand{background:var(--brand);color:#fff;box-shadow:0 6px 14px -6px rgba(108,71,255,.7)}
.lt{font-size:33px;font-weight:700;letter-spacing:-.9px;margin:4px 18px 0}
.lt-sub{margin:2px 18px 0;font-size:13.5px;color:var(--ink-3)}
.search{margin:12px 16px 0;height:38px;border-radius:12px;background:#ECEBF1;display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--ink-4);font-size:15.5px}
.search .ic{width:18px;height:18px}
.chips{display:flex;gap:7px;padding:12px 16px 4px;overflow:hidden}
.chip{height:31px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip b{font-weight:600;color:var(--ink-4);font-size:12px}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chip.on b{color:rgba(255,255,255,.6)}
.av{position:relative;width:50px;height:50px;flex-shrink:0}
.av img,.av .ini{width:50px;height:50px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:17px}
.av .bd{position:absolute;right:-3px;bottom:-3px;border:2.5px solid var(--bg);border-radius:8px}
.brand-ic{display:flex;align-items:center;justify-content:center;border-radius:7px;overflow:hidden}
.brand-ic svg{fill:#fff}
.brand-ic img{width:100%;height:100%;object-fit:cover}
.list{margin-top:6px}
.row{display:flex;gap:12px;align-items:center;padding:9px 16px}
.row .mid{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:4px 0 13px}
.row:last-child .mid{border-bottom:0}
.row .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row .n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:12.5px;color:var(--ink-4);flex-shrink:0}
.row.un .tm{color:var(--brand);font-weight:600}
.row .p{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px}
.row .p span{font-size:14px;color:var(--ink-3);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.un .p span{color:var(--ink-2)}
.cnt{font-style:normal;min-width:21px;height:21px;border-radius:11px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;padding:8px 10px 0;display:flex;justify-content:space-around;background:rgba(250,250,252,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.06);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink-4);width:66px;position:relative}
.tab .ic{width:25px;height:25px}
.tab.on{color:var(--brand)}
.tab .dotn{position:absolute;top:-2px;left:38px;min-width:17px;height:17px;border-radius:9px;background:#FF3B30;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #FAFAFC}
.focus-banner{margin:10px 16px 2px;padding:11px 13px;border-radius:16px;background:linear-gradient(120deg,#6C47FF,#8B63FF);color:#fff;display:flex;align-items:center;gap:11px;box-shadow:0 12px 24px -14px rgba(108,71,255,.9)}
.focus-banner .ico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.focus-banner b{display:block;font-size:14.5px;font-weight:600}
.focus-banner small{font-size:12.5px;opacity:.8}
.focus-banner .go{margin-left:auto;height:28px;padding:0 11px;border-radius:9px;background:var(--lime);color:#1A2300;font-size:12.5px;font-weight:700;display:flex;align-items:center}
.ticks{color:#34B7F1;display:inline-flex;vertical-align:-2px;margin-right:2px}
.ticks .ic{width:16px;height:16px;stroke-width:2.2}

/* ---------- sohbet ---------- */
.chat-h{display:flex;align-items:center;gap:10px;padding:4px 14px 10px;border-bottom:1px solid var(--line);background:rgba(250,250,252,.9)}
.chat-h .back{color:var(--brand);display:flex;align-items:center;font-size:16px;gap:0}
.chat-h .back .ic{width:26px;height:26px}
.chat-h .who{flex:1;min-width:0}
.chat-h .who b{display:block;font-size:16px;font-weight:600}
.chat-h .who small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3)}
.chat-h .who small i{width:7px;height:7px;border-radius:50%;background:#25D366;display:inline-block}
.chat-h .acts{display:flex;gap:16px;color:var(--brand)}
.chat-h .av,.chat-h .av img{width:38px;height:38px}
.msgs{padding:12px 12px 0;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:11.5px;font-weight:600;color:var(--ink-3);background:#ECEBF1;border-radius:8px;padding:3px 9px;margin:4px 0}
.bub{max-width:78%;padding:8px 12px 7px;border-radius:19px;font-size:15px;line-height:1.38;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.04),0 0 0 1px rgba(20,18,40,.04);align-self:flex-start;border-bottom-left-radius:6px}
.bub .m{display:block;text-align:right;font-size:11px;color:var(--ink-4);margin-top:2px}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-left-radius:19px;border-bottom-right-radius:6px}
.bub.me .m{color:rgba(255,255,255,.72)}
.bub.me .ticks{color:var(--lime)}
.file{display:flex;align-items:center;gap:10px;padding:4px 2px}
.file .fi{width:38px;height:44px;border-radius:8px;background:#FFE8E6;color:#E0412F;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.file b{display:block;font-size:14px;font-weight:600}
.file small{font-size:12px;color:var(--ink-3)}
.sum{margin:12px 12px 4px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(108,71,255,.18),0 16px 30px -18px rgba(108,71,255,.55);padding:13px 14px 12px}
.sum .hd{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--brand-ink);letter-spacing:.1px}
.sum .hd .ic{width:17px;height:17px;color:var(--brand)}
.sum .hd span{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--ink-4)}
.sum ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.sum li{display:flex;gap:8px;font-size:14px;line-height:1.38;color:var(--ink-2)}
.sum li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);margin-top:7px;flex-shrink:0}
.sum .act{margin-top:11px;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--brand-soft)}
.sum .act .ic{width:18px;height:18px;color:var(--brand)}
.sum .act div{flex:1;font-size:13.5px;line-height:1.3}
.sum .act div b{font-weight:600}
.sum .act small{display:block;font-size:12px;color:var(--ink-3)}
.pbtn{height:30px;padding:0 12px;border-radius:9px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pbtn.dark{background:var(--ink)}
.pbtn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pbtn.lime{background:var(--lime);color:#1A2300}
.comp{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 30px;background:rgba(250,250,252,.94);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.05)}
.draft{margin:0 2px 8px;padding:10px 11px;border-radius:15px;background:linear-gradient(135deg,#F3EFFF,#FBF9FF);box-shadow:0 0 0 1px rgba(108,71,255,.2)}
.draft .hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--brand-ink)}
.draft .hd .ic{width:15px;height:15px;color:var(--brand)}
.draft .hd span{font-weight:500;color:var(--ink-4)}
.draft p{margin:6px 0 9px;font-size:14.5px;line-height:1.4;color:var(--ink)}
.draft .bt{display:flex;gap:7px}
.inrow{display:flex;align-items:center;gap:8px}
.inrow .plus{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.inrow .field{flex:1;height:38px;border-radius:19px;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;padding:0 14px;color:var(--ink-4);font-size:15px}
.inrow .send{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.inrow .send .ic{width:19px;height:19px;stroke-width:2.4}

/* ---------- odak ---------- */
.fcard{margin:12px 14px 0;border-radius:20px;background:#fff;box-shadow:0 0 0 1px rgba(20,18,40,.05),0 14px 30px -20px rgba(40,30,110,.35);padding:14px}
.fcard .top{display:flex;align-items:center;gap:10px}
.fcard .top .av,.fcard .top .av img{width:40px;height:40px}
.fcard .top b{font-size:15px;font-weight:600;display:block}
.fcard .top small{font-size:12px;color:#D9480F;display:flex;align-items:center;gap:4px;font-weight:500}
.fcard .top small .ic{width:13px;height:13px}
.fcard .q{margin:10px 0 0;font-size:14.5px;line-height:1.4;color:var(--ink-2);padding-left:11px;border-left:3px solid var(--line)}
.fcard .draft{margin:11px 0 0}
.promise{margin:14px 14px 0;border-radius:20px;background:#fff;box-shadow:0 0 0 1px rgba(20,18,40,.05);padding:6px 14px}
.promise h4{margin:8px 0 4px;font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.3px;text-transform:uppercase}
.pr{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:0}
.pr .cb{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px #CFCCDA;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pr .cb.on{background:var(--brand);box-shadow:none;color:#fff}
.pr .cb .ic{width:14px;height:14px;stroke-width:3}
.pr div{flex:1;font-size:14.5px;line-height:1.3}
.pr div small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.pr.done div{color:var(--ink-4);text-decoration:line-through}
.pr .due{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:3px 8px;border-radius:7px}

/* ---------- pazaryeri ---------- */
.seg{margin:12px 16px 0;display:flex;padding:3px;border-radius:11px;background:#ECEBF1}
.seg span{flex:1;height:31px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--ink-2);gap:5px}
.seg span.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600;color:var(--ink)}
.seg span b{font-size:11px;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.ocard{margin:12px 14px 0;border-radius:20px;background:#fff;box-shadow:0 0 0 1px rgba(20,18,40,.05),0 14px 30px -20px rgba(40,30,110,.35);padding:14px}
.ocard .oh{display:flex;align-items:center;gap:10px}
.ocard .oh .pic{width:52px;height:60px;border-radius:12px;background:linear-gradient(160deg,#EFE6D8,#D9C7AE);position:relative;overflow:hidden;flex-shrink:0}
.ocard .oh .pic::after{content:"";position:absolute;left:14px;top:12px;width:24px;height:36px;border-radius:8px 8px 4px 4px;background:#F7F1E6;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.ocard .oh b{display:block;font-size:15px;font-weight:600}
.ocard .oh small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ocard .oh .pr2{margin-left:auto;text-align:right;font-size:15px;font-weight:700}
.ocard .oh .pr2 small{font-weight:500}
.tl{margin:14px 2px 2px;display:flex;align-items:flex-start}
.tl .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11.5px;color:var(--ink-3);text-align:center;font-weight:500}
.tl .st::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.tl .st:first-child::before{display:none}
.tl .st.ok::before{background:var(--green)}
.tl .st .d{width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px var(--line);display:flex;align-items:center;justify-content:center;z-index:1;position:relative}
.tl .st.ok .d{background:var(--green);box-shadow:none;color:#fff}
.tl .st.now .d{background:#fff;box-shadow:inset 0 0 0 2.5px var(--green)}
.tl .st.now .d::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.tl .st .d .ic{width:14px;height:14px;stroke-width:3}
.tl .st.ok,.tl .st.now{color:var(--ink)}
.ship{margin-top:12px;display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:#F4F3F8;font-size:13px;color:var(--ink-2)}
.ship .ic{width:18px;height:18px;color:var(--ink-3)}
.ship b{font-weight:600}
.qcard{margin:12px 14px 0;border-radius:20px;background:#fff;box-shadow:0 0 0 1px rgba(20,18,40,.05),0 14px 30px -20px rgba(40,30,110,.35);padding:14px}
.qcard .qh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.qcard .qh .tag{height:22px;padding:0 8px;border-radius:7px;background:#FFF3E0;color:#B45309;font-weight:600;display:inline-flex;align-items:center;gap:4px;font-size:11.5px}
.qcard .qh .tag .ic{width:13px;height:13px}
.qcard .qq{margin:9px 0 0;font-size:15px;font-weight:600;line-height:1.35}
.qcard .qp{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.mini{display:flex;align-items:center;gap:11px;padding:10px 16px}
.mini .mid{flex:1;min-width:0}
.mini b{display:block;font-size:14.5px;font-weight:600}
.mini small{font-size:12.5px;color:var(--ink-3)}
.pill{height:24px;padding:0 9px;border-radius:8px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.pill.y{background:#FFF6DB;color:#9A6700}.pill.g{background:#E3F7EC;color:#137A47}.pill.b{background:#E8F0FF;color:#1E4FD8}
.sec-t{margin:16px 18px 2px;font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.3px;text-transform:uppercase}

/* ---------- takvim ---------- */
.cal{margin:12px 14px 0;border-radius:20px;background:#fff;box-shadow:0 0 0 1px rgba(20,18,40,.05);padding:12px 12px 10px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-size:16px;font-weight:700}
.cal .mh span{display:flex;gap:14px;color:var(--brand)}
.cal .mh .ic{width:20px;height:20px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal .g .w{font-size:11px;font-weight:600;color:var(--ink-4);padding-bottom:4px}
.cal .g .d{height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14.5px;font-weight:500;position:relative;border-radius:11px}

/** Marka rozeti: renkli kare + beyaz glif (ui.tsx Chip ile aynı kurallar) ya da pazaryeri PNG'si */
function brand(p, size=20, radius){
  const r = radius ?? Math.round(size*.28);
  if (['trendyol','hepsiburada','n11','amazon','etsy','shopier'].includes(p))
    return `<span class="brand-ic" style="width:${size}px;height:${size}px;border-radius:${r}px"><img src="${SHOPIMG(p)}" alt=""></span>`;
  const b = BRANDS[p]; if(!b) return '';
  const g = Math.round(size*b.ratio);
  return `<span class="brand-ic" style="width:${size}px;height:${size}px;border-radius:${r}px;background:${b.bg}"><svg viewBox="${b.vb||'0 0 24 24'}" width="${g}" height="${g}"><path d="${b.path}"/></svg></span>`;
}
function avatar(img, p, size=50, ini, col){
  const face = img ? `<img src="${AV(img)}" alt="" style="width:${size}px;height:${size}px">`

  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".45"/></svg></span></div>`;
